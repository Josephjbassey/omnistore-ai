[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnistore-backend"
version = "2.1.0"
description = "FastAPI backend engine for OmniStore AI with SAM 3.1 & Muse Spark"
authors = [{ name = "OmniStore Hackathon Team" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
omnistore-backend = "backend.main:start"
