[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnistore-backend"
version = "2.1.0"
description = "FastAPI backend engine for OmniStore AI (SAM 3.1, Muse Spark 1.3, Muse Code)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Jabs", email = "jabs@example.com"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
omnistore-backend = "backend.main:start"

[tool.setuptools]
packages = [
    "backend",
    "backend.cli",
    "backend.core",
    "backend.omnistore",
    "backend.omnistore.memory",
    "backend.omnistore.themes",
    "backend.memory",
    "backend.models",
    "backend.overlay",
    "backend.routers",
    "backend.services",
    "backend.skills",
    "backend.tests",
    "backend.vision",
    "backend.voice",
]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py311"
